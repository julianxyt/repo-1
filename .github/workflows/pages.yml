name: Deploy Kruger Life List to Pages

on:
  push:
    branches: [master, claude/kruger-wildlife-checklist-6gga2w]
    paths: ['index.html', 'sw.js', 'icon.svg', 'manifest.webmanifest', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publish only what the app needs — not build/, tests/ or the README.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html sw.js icon.svg manifest.webmanifest _site/
          touch _site/.nojekyll
          ls -la _site

      - name: Check the build is current
        run: |
          ./build.sh
          git diff --exit-code -- index.html \
            || { echo "::error::index.html is stale — run ./build.sh and commit the result."; exit 1; }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
