<style>
/* ---- dex grid: the photo is the point, so it gets the whole card width ---- */
.grouphead{display:flex;align-items:center;gap:9px;padding:18px 14px 8px}
.grouphead h2{margin:0;font-weight:900;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.grouphead .gcount{font-family:Silkscreen,monospace;font-size:10px;color:var(--ink-3)}
.grouphead hr{flex:1;border:0;border-top:2px solid var(--line);margin:0}

.dexgrid{list-style:none;margin:0;padding:0 14px;display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
@media (min-width:560px){.dexgrid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:740px){.dexgrid{grid-template-columns:repeat(4,1fr)}}

.dex{
  width:100%;text-align:left;cursor:pointer;padding:0;overflow:hidden;
  background:var(--screen-2);border:2px solid var(--line);border-bottom-width:3px;
  border-radius:var(--r);display:flex;flex-direction:column;
}
.dex:hover{border-color:var(--ink-3)}
.dex.is-seen{background:var(--screen);border-color:var(--caught)}

.dex-top{display:flex;align-items:center;justify-content:space-between;padding:5px 7px 4px;gap:6px}
.dex-no{font-family:Silkscreen,monospace;font-size:9.5px;color:var(--ink-3)}
.dex.is-seen .dex-no{color:var(--caught)}
.ball{width:13px;height:13px;border-radius:50%;border:2px solid var(--ink-3);flex:0 0 auto;position:relative;background:var(--screen-3)}
.dex.is-seen .ball{border-color:var(--caught);background:var(--caught)}
.dex.is-seen .ball::after{content:"";position:absolute;left:1px;right:1px;top:3.5px;height:2px;background:var(--screen)}

/* the picture window — a screen inside the screen */
.shotwin{
  position:relative;aspect-ratio:1;background:var(--screen-sunk);
  border-top:2px solid var(--line);border-bottom:2px solid var(--line);
  display:grid;place-items:center;overflow:hidden;
}
.dex.is-seen .shotwin{border-color:var(--caught)}
.shotwin img{width:100%;height:100%;object-fit:cover;display:block}
.shotwin .sil{width:66%;height:66%;color:var(--ink);opacity:.16;fill:currentColor}
.dex.is-seen .shotwin .sil{opacity:.26;color:var(--caught)}
.shotwin .multi{
  position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.7);color:#fff;
  font-family:Silkscreen,monospace;font-size:8.5px;padding:1px 4px;border-radius:2px;
}
.shotwin .nophoto{
  position:absolute;inset:auto 0 0 0;background:var(--caught);color:var(--screen);
  font-family:Silkscreen,monospace;font-size:8px;text-align:center;padding:2px 0;letter-spacing:.06em;
}

.dex-body{padding:7px 8px 9px;display:flex;flex-direction:column;gap:4px;flex:1}
.dex-name{font-weight:700;font-size:13px;line-height:1.2;letter-spacing:-.01em;color:var(--ink)}
.dex-sci{font-size:10px;font-style:italic;color:var(--ink-3);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto;padding-top:4px}
.tag{font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:2px 5px;border-radius:2px;border:1.5px solid}
.r1{color:var(--ink-3);border-color:var(--line);background:var(--screen-3)}
.r2{color:var(--caught);border-color:var(--caught);background:var(--caught-soft)}
.r3{color:var(--gold);border-color:var(--gold);background:var(--gold-soft)}
.r4{color:var(--vrare);border-color:var(--vrare);background:var(--vrare-soft)}
.coll{color:var(--ink-2);border-color:var(--line);background:var(--screen-3)}
.empty{padding:44px 20px;text-align:center;color:var(--ink-3)}
.empty strong{display:block;font-weight:900;font-size:14px;color:var(--ink-2);margin-bottom:5px}

/* ---- entry screen ---- */
.sheet{position:fixed;inset:0;z-index:60;background:var(--shell);overflow-y:auto;animation:rise .18s ease-out}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.sheet-inner{max-width:760px;margin:0 auto;padding:0 0 110px}
.sheet-bar{position:sticky;top:0;z-index:2;background:var(--shell);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:3px solid var(--shell-lo)}
.backbtn{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.18);border:1px solid var(--shell-lo);cursor:pointer;color:var(--shell-ink);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:7px 10px;border-radius:var(--r)}
.backbtn svg{width:13px;height:13px}
.sheet-no{font-family:Silkscreen,monospace;font-size:13px;color:var(--shell-ink)}

.entry{background:var(--screen);border-top:2px solid var(--shell-lo);padding:0 14px 20px}
.bigshot{
  position:relative;margin:14px 0 0;aspect-ratio:1;background:var(--screen-sunk);
  border:3px solid var(--shell-lo);border-radius:var(--r);overflow:hidden;display:grid;place-items:center;
}
.bigshot img{width:100%;height:100%;object-fit:cover}
.bigshot .sil{width:58%;height:58%;color:var(--ink);opacity:.17;fill:currentColor}
.entry h2{margin:14px 0 0;font-weight:900;font-size:25px;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.entry .sci{font-style:italic;font-size:14px;color:var(--ink-3);margin-top:2px}
.entry .chips{margin-top:9px}
.dexsec{
  margin:14px 0 0;background:var(--screen-2);border:2px solid var(--line);
  border-left-width:4px;border-left-color:var(--ink-3);border-radius:var(--r);padding:10px 12px 12px;
}
.dexsec.where{border-left-color:var(--caught)}
.dexsec h3{
  margin:0 0 4px;font-family:Silkscreen,monospace;font-size:9px;font-weight:400;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
}
.dexsec p{margin:0;color:var(--ink-2);font-size:13.5px;line-height:1.55;max-width:62ch}

.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin:15px 0 0}
.shot{position:relative;aspect-ratio:1;background:var(--screen-sunk);border:2px solid var(--line);border-radius:2px;overflow:hidden}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.72);border:0;color:#fff;width:22px;height:22px;border-radius:2px;cursor:pointer;display:grid;place-items:center;padding:0}
.shot .del svg{width:11px;height:11px}
.shot .recrop{
  position:absolute;top:2px;left:2px;background:rgba(0,0,0,.72);border:0;color:#fff;
  width:22px;height:22px;border-radius:2px;cursor:pointer;display:grid;place-items:center;padding:0;
}
.shot .recrop svg{width:12px;height:12px}
.dropzone{aspect-ratio:1;border:2px dashed var(--line);border-radius:2px;display:grid;place-items:center;color:var(--ink-3);text-align:center;font-family:Silkscreen,monospace;font-size:8.5px;padding:6px}

.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  border:2px solid var(--line);border-bottom-width:3px;background:var(--screen-2);color:var(--ink);
  padding:10px 12px;border-radius:var(--r);font-size:11px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;flex:1 1 auto;
}
.btn svg{width:15px;height:15px;flex:0 0 auto}
.btn:hover{background:var(--screen-3)}
.btn.primary{background:var(--caught);border-color:var(--caught);color:var(--screen)}
.btn.ghost{flex:0 0 auto;color:var(--ink-3)}

.fields{display:flex;flex-direction:column;gap:11px;margin-top:15px}
.field label{display:block;font-family:Silkscreen,monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.field input,.field textarea{width:100%;padding:9px 10px;border:2px solid var(--line);background:var(--screen-2);border-radius:var(--r);color:var(--ink)}
.field textarea{min-height:78px;resize:vertical;line-height:1.5}

/* ---- progress + collections ---- */
.panel{padding:16px 14px}
.bars{display:flex;flex-direction:column;gap:13px;margin-top:4px}
.bar-row .bar-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:4px}
.bar-name{font-weight:900;font-size:11px;letter-spacing:.13em;text-transform:uppercase}
.bar-num{font-family:Silkscreen,monospace;font-size:10px;color:var(--ink-3)}
.bar-num em{font-style:normal;color:var(--ink)}
.bar-track{height:10px;background:var(--screen-sunk);border:2px solid var(--line);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;background:var(--caught);width:0;transition:width .4s ease}
.bar-fill.gold{background:var(--gold)}
.bar-fill.lilac{background:var(--vrare)}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:4px}
@media (min-width:620px){.statgrid{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--screen-2);border:2px solid var(--line);border-bottom-width:3px;border-radius:var(--r);padding:11px 11px 13px}
.stat-k{font-family:Silkscreen,monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.stat-v{font-family:Silkscreen,monospace;font-weight:700;font-size:22px;line-height:1.2;margin-top:5px;color:var(--ink)}
.stat-sub{font-size:10.5px;color:var(--ink-3);margin-top:2px}
.section-title{font-weight:900;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;margin:26px 0 5px;display:flex;align-items:center;gap:9px}
.section-title:first-child{margin-top:0}
.section-title hr{flex:1;border:0;border-top:2px solid var(--line);margin:0}
.section-note{color:var(--ink-3);font-size:12.5px;margin:0 0 12px;max-width:62ch}
.collcard{border:2px solid var(--line);border-bottom-width:3px;border-radius:var(--r);background:var(--screen-2);padding:13px;margin-bottom:11px}
.collcard header{display:flex;align-items:baseline;justify-content:space-between;gap:9px;margin-bottom:3px}
.collcard h3{margin:0;font-weight:900;font-size:15px;letter-spacing:-.01em}
.collcard .cdone{font-family:Silkscreen,monospace;font-size:11px;color:var(--ink-3)}
.collcard .cdone.full{color:var(--caught)}
.collcard p{margin:0 0 10px;font-size:12.5px;color:var(--ink-3);max-width:60ch}
.colllist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.colllist button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;cursor:pointer;background:var(--screen-3);border:2px solid transparent;border-radius:2px;padding:6px 8px}
.colllist button.done{border-color:var(--caught);background:var(--caught-soft)}
.cn{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- menu ---- */
.menu{position:fixed;inset:auto 0 0 0;z-index:70;background:var(--screen);border-top:3px solid var(--shell-lo);padding:14px 14px calc(18px + env(safe-area-inset-bottom));animation:rise .18s ease-out}
.menu-inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:7px}
.menu h3{margin:0 0 2px;font-weight:900;font-size:11.5px;letter-spacing:.15em;text-transform:uppercase}
.menu p{margin:0 0 5px;font-size:12.5px;color:var(--ink-3);max-width:60ch}
.storageline{border-left:3px solid var(--line);padding-left:10px}
.storageline.ok{border-left-color:var(--caught);color:var(--ink-2)}
.storageline.warn{border-left-color:var(--gold);color:var(--ink-2)}
.scrim{position:fixed;inset:0;z-index:69;background:rgba(10,6,5,.6)}
.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:90;background:var(--ink);color:var(--screen);padding:9px 14px;border-radius:var(--r);
  font-size:12.5px;font-weight:600;max-width:88vw;text-align:center;border:2px solid var(--shell-lo);
}
.footnote{padding:24px 14px 0;color:var(--ink-3);font-size:11.5px;line-height:1.6;max-width:64ch}
</style>
<style>
/* ---- crop and zoom, before anything is stored ---- */
.cropper{position:fixed;inset:0;z-index:80;background:var(--shell);display:flex;flex-direction:column}
.crop-bar{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 14px;border-bottom:3px solid var(--shell-lo);flex:0 0 auto;
}
.crop-bar b{font-weight:900;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--shell-ink)}
.crop-bar .of{font-family:Silkscreen,monospace;font-size:10px;color:rgba(255,237,233,.7)}
.crop-stage{flex:1;display:grid;place-items:center;padding:14px;min-height:0;overflow:hidden}
.crop-frame{
  position:relative;width:min(92vw,460px);max-height:100%;aspect-ratio:1;overflow:hidden;
  background:var(--screen-sunk);border:3px solid var(--shell-lo);border-radius:var(--r);
  touch-action:none;cursor:grab;
}
.crop-frame:active{cursor:grabbing}
.crop-frame img{
  position:absolute;left:0;top:0;display:block;
  /* the host stylesheet sets img{max-width:100%}, which would clamp the preview
     to the frame while the pan offset assumes its real size */
  max-width:none;max-height:none;
  user-select:none;-webkit-user-drag:none;pointer-events:none;
}
.crop-grid{
  position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(to right, transparent calc(33.333% - 1px), rgba(255,255,255,.34) calc(33.333% - 1px), rgba(255,255,255,.34) 33.333%, transparent 33.333%, transparent calc(66.667% - 1px), rgba(255,255,255,.34) calc(66.667% - 1px), rgba(255,255,255,.34) 66.667%, transparent 66.667%),
    linear-gradient(to bottom, transparent calc(33.333% - 1px), rgba(255,255,255,.34) calc(33.333% - 1px), rgba(255,255,255,.34) 33.333%, transparent 33.333%, transparent calc(66.667% - 1px), rgba(255,255,255,.34) calc(66.667% - 1px), rgba(255,255,255,.34) 66.667%, transparent 66.667%);
}
.crop-ctrls{
  flex:0 0 auto;background:var(--screen);border-top:2px solid var(--shell-lo);
  padding:12px 14px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:11px;
}
.crop-row{display:flex;align-items:center;gap:10px}
.crop-row > span{font-family:Silkscreen,monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);flex:0 0 auto;min-width:38px}
.crop-row input[type="range"]{flex:1;accent-color:var(--caught);height:22px}
.sizepick{display:flex;gap:5px;flex:1}
.sizepick button{
  flex:1;background:var(--screen-2);border:2px solid var(--line);border-bottom-width:3px;color:var(--ink-2);
  padding:7px 4px;border-radius:var(--r);cursor:pointer;font-size:10px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;
}
.sizepick button[aria-pressed="true"]{background:var(--caught);border-color:var(--caught);color:var(--screen)}
.sizepick button small{display:block;font-family:Silkscreen,monospace;font-size:8px;font-weight:400;opacity:.75;margin-top:2px;letter-spacing:0}
.crop-hint{font-size:11.5px;color:var(--ink-3);margin:0}
</style>
