<script>
(function(){
"use strict";

/* ---------------- parse the checklist ---------------- */
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const SPECIES = [];
GROUPS.forEach((g, gi) => {
  (RAW[g.key]||'').trim().split('\n').forEach((line, i) => {
    if(!line.trim()) return;
    const [name, sci, rar, colls] = line.split('|');
    SPECIES.push({
      id: g.key + '-' + slug(name),
      group: g.key, gi, ord: i,
      name: name.trim(), sci: (sci||'').trim(),
      rarity: parseInt(rar,10) || 1,
      colls: (colls||'').split(',').map(s=>s.trim()).filter(Boolean),
      hay: (name + ' ' + sci + ' ' + g.name).toLowerCase()
    });
  });
});
SPECIES.forEach((sp, i) => { sp.no = String(i + 1).padStart(3, '0'); });
const BY_ID = new Map(SPECIES.map(s => [s.id, s]));
const TOTAL = SPECIES.length;
const GROUP_OF = Object.fromEntries(GROUPS.map(g => [g.key, g]));

const RARITY_NOTE = {
  1:'Common. If you spend a few days in the park with your eyes open, this one finds you.',
  2:'Uncommon. Present throughout, but it takes a deliberate look — or the right time of day.',
  3:'Rare. Expect to earn this one. Right habitat, right hour, and a good measure of luck.',
  4:'Very rare. A genuine trophy sighting. Plenty of Kruger regulars go a decade without one.'
};

/* ---------------- storage: IndexedDB, entirely on-device ---------------- */
const DB_NAME = 'kruger-life-list', DB_VER = 1;
let idb = null;

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains('log')) db.createObjectStore('log', {keyPath:'id'});
      if(!db.objectStoreNames.contains('photos')) db.createObjectStore('photos', {keyPath:'pid'});
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
/* Private browsing can refuse IndexedDB outright. Rather than break, fall back to
   memory for the session and say so once — a lost tick beats a dead app. */
const MEM = {log:new Map(), photos:new Map()};
let useMem = false;
function tx(store){
  if(useMem){
    const m = MEM[store];
    return {
      get:    k => ({_v: m.get(k)}),
      getAll: () => ({_v: [...m.values()]}),
      put:    v => { m.set(v.id !== undefined ? v.id : v.pid, v); return {_v: undefined}; },
      delete: k => { m.delete(k); return {_v: undefined}; }
    };
  }
  return idb.transaction(store, arguments[1]).objectStore(store);
}
function pReq(r){
  if(r && Object.prototype.hasOwnProperty.call(r, '_v')) return Promise.resolve(r._v);
  return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
}

const LOG = new Map();        // id -> {id, seen, ts, date, place, notes, photos:[pid]}
const PHOTO_URLS = new Map(); // pid -> {full, thumb}

async function loadAll(){
  const rows = await pReq(tx('log','readonly').getAll());
  rows.forEach(r => LOG.set(r.id, r));
}
function entry(id){
  let e = LOG.get(id);
  if(!e){ e = {id, seen:false, ts:0, date:'', place:'', notes:'', photos:[]}; LOG.set(id, e); }
  return e;
}
const hasContent = e => !!(e.seen || e.photos.length || e.notes || e.place || e.date);
async function saveEntry(e){
  if(!hasContent(e)){
    LOG.delete(e.id);
    await pReq(tx('log','readwrite').delete(e.id));
  } else {
    await pReq(tx('log','readwrite').put(JSON.parse(JSON.stringify(e))));
  }
}
async function getPhoto(pid){ return pReq(tx('photos','readonly').get(pid)); }

async function urlsFor(pid){
  if(PHOTO_URLS.has(pid)) return PHOTO_URLS.get(pid);
  const rec = await getPhoto(pid);
  if(!rec) return null;
  const u = {full: URL.createObjectURL(rec.full), thumb: URL.createObjectURL(rec.thumb)};
  PHOTO_URLS.set(pid, u);
  return u;
}
async function dropPhoto(pid){
  const u = PHOTO_URLS.get(pid);
  if(u){ URL.revokeObjectURL(u.full); URL.revokeObjectURL(u.thumb); PHOTO_URLS.delete(pid); }
  await pReq(tx('photos','readwrite').delete(pid));
}

/* Output sizes. A phone photo is ~5 MB and a life list is hundreds of them, so
   everything is re-encoded on the way in — the choice is how much detail to keep. */
const SIZES = [
  {key:'compact',  label:'Compact',  px:1000, q:0.80, note:'~120 KB'},
  {key:'standard', label:'Standard', px:1600, q:0.82, note:'~280 KB'},
  {key:'high',     label:'High',     px:2400, q:0.86, note:'~650 KB'}
];
function preferredSize(){
  try{
    const hit = SIZES.find(z => z.key === localStorage.getItem('kll-photo-size'));
    if(hit) return hit;
  }catch(_){}
  return SIZES[1];
}
function rememberSize(key){ try{ localStorage.setItem('kll-photo-size', key); }catch(_){} }

const loadImage = src => new Promise((res, rej) => {
  const i = new Image();
  i.onload = () => res(i);
  i.onerror = () => rej(new Error('That file could not be read as an image.'));
  i.src = src;
});
const canvasBlob = (c, q) => new Promise((res, rej) =>
  c.toBlob(x => x ? res(x) : rej(new Error('encode failed')), 'image/jpeg', q));

/* Square crop, because the dex card window is square — cropping here means the
   framing you pick is the framing that gets stored, rather than whatever
   object-fit happens to leave in view. Resolves {full, thumb}, or null if
   cancelled. */
async function cropDialog(file, index, total){
  const url = URL.createObjectURL(file);
  let img;
  try{ img = await loadImage(url); }
  catch(err){ URL.revokeObjectURL(url); toast(err.message); return null; }

  let size = preferredSize();
  const ui = el('div','cropper');
  ui.innerHTML = `
    <div class="crop-bar">
      <b>Frame the shot</b>
      <span class="of">${total > 1 ? (index + 1) + ' / ' + total : ''}</span>
    </div>
    <div class="crop-stage">
      <div class="crop-frame" id="cFrame"><div class="crop-grid"></div></div>
    </div>
    <div class="crop-ctrls">
      <p class="crop-hint">Drag to move it. Pinch or use the slider to zoom in.</p>
      <div class="crop-row"><span>Zoom</span><input type="range" id="cZoom" min="100" max="500" value="100" aria-label="Zoom"></div>
      <div class="crop-row"><span>Size</span><div class="sizepick" id="cSize"></div></div>
      <div class="btnrow">
        <button class="btn" id="cRotate">Rotate</button>
        <button class="btn ghost" id="cCancel">Cancel</button>
        <button class="btn primary" id="cSave">Use photo</button>
      </div>
    </div>`;
  document.body.appendChild(ui);
  document.body.style.overflow = 'hidden';

  const frame = ui.querySelector('#cFrame');
  const grid = frame.querySelector('.crop-grid');
  const zoomEl = ui.querySelector('#cZoom');
  const sizeBox = ui.querySelector('#cSize');

  SIZES.forEach(z => {
    const btn = el('button');
    btn.type = 'button';
    btn.innerHTML = `${z.label}<small>${z.px}px · ${z.note}</small>`;
    btn.setAttribute('aria-pressed', String(z.key === size.key));
    btn.addEventListener('click', () => {
      size = z;
      rememberSize(z.key);
      sizeBox.querySelectorAll('button').forEach((n, i) => n.setAttribute('aria-pressed', String(SIZES[i].key === z.key)));
    });
    sizeBox.appendChild(btn);
  });

  let node = null, base = 1, zoom = 1, tx = 0, ty = 0, V = 0;

  function mount(){
    if(node) node.remove();
    node = el('img');
    node.alt = '';
    node.src = img.src;
    frame.insertBefore(node, grid);
    V = frame.clientWidth || 300;
    base = Math.max(V / img.naturalWidth, V / img.naturalHeight);
    zoom = 1;
    zoomEl.value = '100';
    tx = (V - img.naturalWidth * base) / 2;
    ty = (V - img.naturalHeight * base) / 2;
    paint();
  }
  function paint(){
    const scale = base * zoom;
    const dw = img.naturalWidth * scale, dh = img.naturalHeight * scale;
    tx = Math.min(0, Math.max(V - dw, tx));
    ty = Math.min(0, Math.max(V - dh, ty));
    node.style.width = dw + 'px';
    node.style.height = dh + 'px';
    node.style.left = tx + 'px';
    node.style.top = ty + 'px';
  }
  /* Zoom about a point in the frame, so whatever is under your fingers stays put. */
  function zoomTo(next, px, py){
    next = Math.min(5, Math.max(1, next));
    const s0 = base * zoom, s1 = base * next;
    tx = px - (px - tx) / s0 * s1;
    ty = py - (py - ty) / s0 * s1;
    zoom = next;
    zoomEl.value = String(Math.round(zoom * 100));
    paint();
  }

  const pts = new Map();
  let pinch = null;
  frame.addEventListener('pointerdown', ev => {
    frame.setPointerCapture(ev.pointerId);
    pts.set(ev.pointerId, {x: ev.clientX, y: ev.clientY});
    if(pts.size === 2){
      const [p, q] = [...pts.values()];
      pinch = {d: Math.hypot(p.x - q.x, p.y - q.y), z: zoom};
    }
  });
  frame.addEventListener('pointermove', ev => {
    const prev = pts.get(ev.pointerId);
    if(!prev) return;
    const now = {x: ev.clientX, y: ev.clientY};
    pts.set(ev.pointerId, now);
    const r = frame.getBoundingClientRect();
    if(pts.size >= 2 && pinch){
      const [p, q] = [...pts.values()];
      const d = Math.hypot(p.x - q.x, p.y - q.y);
      if(pinch.d > 0) zoomTo(pinch.z * (d / pinch.d), (p.x + q.x) / 2 - r.left, (p.y + q.y) / 2 - r.top);
    } else {
      tx += now.x - prev.x;
      ty += now.y - prev.y;
      paint();
    }
  });
  const release = ev => { pts.delete(ev.pointerId); if(pts.size < 2) pinch = null; };
  frame.addEventListener('pointerup', release);
  frame.addEventListener('pointercancel', release);
  frame.addEventListener('wheel', ev => {
    ev.preventDefault();
    const r = frame.getBoundingClientRect();
    zoomTo(zoom * (ev.deltaY < 0 ? 1.12 : 0.89), ev.clientX - r.left, ev.clientY - r.top);
  }, {passive:false});
  zoomEl.addEventListener('input', () => zoomTo(+zoomEl.value / 100, V / 2, V / 2));

  ui.querySelector('#cRotate').addEventListener('click', async () => {
    const c = document.createElement('canvas');
    c.width = img.naturalHeight;
    c.height = img.naturalWidth;
    const ctx = c.getContext('2d');
    ctx.translate(c.width / 2, c.height / 2);
    ctx.rotate(Math.PI / 2);
    ctx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
    let blob;
    try{ blob = await canvasBlob(c, 0.95); }catch(_){ return; }
    const next = URL.createObjectURL(blob);
    const old = img.src;
    try{
      img = await loadImage(next);
      if(old !== url) URL.revokeObjectURL(old);
      mount();
    }catch(_){ URL.revokeObjectURL(next); }
  });

  mount();
  window.addEventListener('resize', mount);

  return new Promise(resolve => {
    const done = out => {
      window.removeEventListener('resize', mount);
      if(img.src !== url) URL.revokeObjectURL(img.src);
      URL.revokeObjectURL(url);
      ui.remove();
      document.body.style.overflow = '';
      resolve(out);
    };
    ui.querySelector('#cCancel').addEventListener('click', () => done(null));
    ui.querySelector('#cSave').addEventListener('click', async () => {
      const scale = base * zoom;
      const side = Math.min(V / scale, img.naturalWidth, img.naturalHeight);
      const sx = Math.max(0, Math.min(-tx / scale, img.naturalWidth - side));
      const sy = Math.max(0, Math.min(-ty / scale, img.naturalHeight - side));
      const render = n => {
        const c = document.createElement('canvas');
        c.width = c.height = n;
        c.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, n, n);
        return c;
      };
      try{
        // never upscale past what the crop actually contains
        const px = Math.max(400, Math.min(size.px, Math.round(side)));
        const [full, thumb] = await Promise.all([
          canvasBlob(render(px), size.q),
          canvasBlob(render(200), 0.7)
        ]);
        done({full, thumb});
      }catch(_){
        toast('That photo could not be saved.');
        done(null);
      }
    });
  });
}

async function addPhotos(id, files){
  const e = entry(id);
  const imgs = [...files].filter(f => f.type.startsWith('image/'));
  let added = 0;
  for(let i = 0; i < imgs.length; i++){
    const out = await cropDialog(imgs[i], i, imgs.length);
    if(!out) continue;                    // cancelled — skip it, keep any others
    const pid = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
    await pReq(tx('photos','readwrite').put({pid, full: out.full, thumb: out.thumb}));
    e.photos.push(pid);
    added++;
  }
  if(added && !e.seen){ e.seen = true; e.ts = Date.now(); if(!e.date) e.date = todayStr(); }
  if(added) await saveEntry(e);
  return added;
}
const todayStr = () => new Date().toISOString().slice(0,10);

/* ---------------- view state ---------------- */
const S = {view:'list', group:'all', status:'all', sort:'taxo', q:'', open:null};
const $ = s => document.querySelector(s);
const el = (t, cls, txt) => { const n = document.createElement(t); if(cls) n.className = cls; if(txt != null) n.textContent = txt; return n; };
const icon = name => `<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;
const isSeen = id => !!(LOG.get(id) && LOG.get(id).seen);

function seenCount(list){ return list.reduce((n, s) => n + (isSeen(s.id) ? 1 : 0), 0); }

/* ---------------- masthead ---------------- */
function renderTally(){
  const done = seenCount(SPECIES);
  $('#tallySeen').textContent = done;
  $('#tallyTot').textContent = TOTAL;
  $('#tallyPct').textContent = (TOTAL ? Math.round(done / TOTAL * 100) : 0) + '%';
  const rail = $('#rail');
  if(!rail.children.length){
    GROUPS.forEach(g => {
      const n = SPECIES.filter(s => s.group === g.key).length;
      const seg = el('div','rail-seg');
      seg.style.flex = n + ' 1 0';
      seg.title = g.name;
      seg.appendChild(el('div','rail-fill'));
      seg.dataset.g = g.key;
      rail.appendChild(seg);
    });
  }
  GROUPS.forEach(g => {
    const list = SPECIES.filter(s => s.group === g.key);
    const pct = list.length ? seenCount(list) / list.length * 100 : 0;
    rail.querySelector(`[data-g="${g.key}"] .rail-fill`).style.width = pct + '%';
  });
}

/* ---------------- checklist ---------------- */
function renderChips(){
  const box = $('#groupChips');
  if(box.children.length) { updateChipCounts(); return; }
  const mk = (key, label, n) => {
    const b = el('button','chip');
    b.type = 'button'; b.dataset.g = key;
    b.setAttribute('aria-pressed', String(S.group === key));
    b.innerHTML = `${label} <b data-c="${key}"></b>`;
    b.addEventListener('click', () => {
      S.group = key;
      box.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.g === key)));
      renderList();
    });
    return b;
  };
  box.appendChild(mk('all','All'));
  GROUPS.forEach(g => box.appendChild(mk(g.key, g.name)));
  updateChipCounts();
}
function updateChipCounts(){
  $('#groupChips').querySelector('[data-c="all"]').textContent = seenCount(SPECIES) + '/' + TOTAL;
  GROUPS.forEach(g => {
    const list = SPECIES.filter(s => s.group === g.key);
    const n = $('#groupChips').querySelector(`[data-c="${g.key}"]`);
    if(n) n.textContent = seenCount(list) + '/' + list.length;
  });
}

function filtered(){
  let out = SPECIES;
  if(S.group !== 'all') out = out.filter(s => s.group === S.group);
  if(S.status === 'seen') out = out.filter(s => isSeen(s.id));
  if(S.status === 'todo') out = out.filter(s => !isSeen(s.id));
  if(S.q){
    const q = S.q.toLowerCase();
    out = out.filter(s => s.hay.includes(q));
  }
  out = out.slice();
  if(S.sort === 'az') out.sort((a,b) => a.name.localeCompare(b.name));
  else if(S.sort === 'rarity') out.sort((a,b) => b.rarity - a.rarity || a.gi - b.gi || a.ord - b.ord);
  else if(S.sort === 'recent') out.sort((a,b) => ((LOG.get(b.id)||{}).ts||0) - ((LOG.get(a.id)||{}).ts||0) || a.name.localeCompare(b.name));
  else out.sort((a,b) => a.gi - b.gi || a.ord - b.ord);
  return out;
}

function rowFor(sp){
  const e = LOG.get(sp.id);
  const seen = !!(e && e.seen);
  const li = el('li');
  const card = el('button', 'dex' + (seen ? ' is-seen' : ''));
  card.type = 'button';
  card.setAttribute('aria-label', sp.name + (seen ? ', recorded' : ', not yet recorded'));

  const top = el('div','dex-top');
  top.innerHTML = `<span class="dex-no">No.${sp.no}</span><span class="ball"></span>`;
  card.appendChild(top);

  const win = el('div','shotwin');
  win.innerHTML = `<span class="glyph">${GROUP_OF[sp.group].glyph}</span>`;
  if(e && e.photos.length){
    urlsFor(e.photos[0]).then(u => {
      if(!u) return;
      win.innerHTML = `<img alt="" src="${u.thumb}">`;
      if(e.photos.length > 1) win.insertAdjacentHTML('beforeend', `<span class="multi">${e.photos.length}</span>`);
    });
  } else if(seen){
    win.insertAdjacentHTML('beforeend', '<span class="nophoto">SEEN · NO PHOTO</span>');
  }
  card.appendChild(win);

  const body = el('div','dex-body');
  body.appendChild(el('div','dex-name', sp.name));
  body.appendChild(el('div','dex-sci', sp.sci));
  const chips = el('div','chips');
  chips.appendChild(el('span','tag r' + sp.rarity, RARITY[sp.rarity]));
  sp.colls.forEach(c => {
    const col = COLLECTIONS.find(x => x.key === c);
    if(col) chips.appendChild(el('span','tag coll', col.name.replace(/^The /,'')));
  });
  body.appendChild(chips);
  card.appendChild(body);

  card.addEventListener('click', () => openSheet(sp.id));
  li.appendChild(card);
  return li;
}

function renderList(){
  updateChipCounts();
  const body = $('#listBody');
  body.textContent = '';
  const rows = filtered();
  const done = seenCount(rows);
  $('#countNote').textContent = rows.length
    ? `${rows.length} species shown · ${done} logged · ${rows.length - done} to find`
    : '';

  if(!rows.length){
    const e = el('div','empty');
    e.innerHTML = '<strong>Nothing matches</strong>Try a different spelling, or clear the filters.';
    body.appendChild(e);
    return;
  }

  if(S.sort === 'taxo' && S.group === 'all'){
    GROUPS.forEach(g => {
      const chunk = rows.filter(s => s.group === g.key);
      if(!chunk.length) return;
      const h = el('div','grouphead');
      h.innerHTML = `<h2>${g.name}</h2><span class="gcount">${seenCount(chunk)}/${chunk.length}</span><hr>`;
      body.appendChild(h);
      const ul = el('ul','dexgrid');
      chunk.forEach(s => ul.appendChild(rowFor(s)));
      body.appendChild(ul);
    });
  } else {
    const ul = el('ul','dexgrid');
    ul.style.marginTop = '12px';
    rows.forEach(s => ul.appendChild(rowFor(s)));
    body.appendChild(ul);
  }
}

/* ---------------- collections ---------------- */
function renderCollections(){
  const box = $('#collBody');
  box.textContent = '';
  COLLECTIONS.forEach(col => {
    const members = SPECIES.filter(s => s.colls.includes(col.key));
    const done = seenCount(members);
    const card = el('div','collcard');
    const head = el('header');
    head.innerHTML = `<h3>${col.name}</h3><span class="cdone${done === members.length ? ' full' : ''}">${done}/${members.length}</span>`;
    card.appendChild(head);
    card.appendChild(el('p', null, col.note));
    const ul = el('ul','colllist');
    members.forEach(sp => {
      const li = el('li');
      const b = el('button', isSeen(sp.id) ? 'done' : '');
      b.type = 'button';
      b.innerHTML = `<span class="cdot">${icon('check')}</span><span class="cn">${sp.name}</span>`;
      b.addEventListener('click', () => openSheet(sp.id));
      li.appendChild(b);
      ul.appendChild(li);
    });
    card.appendChild(ul);
    box.appendChild(card);
  });
}

/* ---------------- progress ---------------- */
function bar(name, done, total, tone){
  const row = el('div','bar-row');
  const pct = total ? done / total * 100 : 0;
  row.innerHTML =
    `<div class="bar-top"><span class="bar-name">${name}</span>` +
    `<span class="bar-num"><em>${done}</em> / ${total}&nbsp;&nbsp;${Math.round(pct)}%</span></div>` +
    `<div class="bar-track"><div class="bar-fill${tone ? ' ' + tone : ''}"></div></div>`;
  requestAnimationFrame(() => { row.querySelector('.bar-fill').style.width = pct + '%'; });
  return row;
}
function renderProgress(){
  const logged = seenCount(SPECIES);
  const withPhotos = SPECIES.filter(s => { const e = LOG.get(s.id); return e && e.photos.length; }).length;
  const shots = [...LOG.values()].reduce((n, e) => n + e.photos.length, 0);
  const best = SPECIES.filter(s => isSeen(s.id)).reduce((m, s) => Math.max(m, s.rarity), 0);

  const g = $('#statGrid');
  g.textContent = '';
  const stat = (k, v, sub) => {
    const d = el('div','stat');
    d.innerHTML = `<div class="stat-k">${k}</div><div class="stat-v">${v}</div><div class="stat-sub">${sub}</div>`;
    return d;
  };
  g.appendChild(stat('Logged', logged, TOTAL - logged + ' still to find'));
  g.appendChild(stat('Photographed', withPhotos, shots + (shots === 1 ? ' photo' : ' photos')));
  g.appendChild(stat('Hardest find', best ? RARITY[best] : '—', best ? 'best tier reached' : 'nothing logged yet'));
  g.appendChild(stat('Completion', (TOTAL ? Math.round(logged / TOTAL * 100) : 0) + '%', 'of the full checklist'));

  const gb = $('#groupBars');
  gb.textContent = '';
  GROUPS.forEach(gr => {
    const list = SPECIES.filter(s => s.group === gr.key);
    gb.appendChild(bar(gr.name, seenCount(list), list.length));
  });

  const rb = $('#rarityBars');
  rb.textContent = '';
  [1,2,3,4].forEach(r => {
    const list = SPECIES.filter(s => s.rarity === r);
    rb.appendChild(bar(RARITY[r], seenCount(list), list.length, r === 3 ? 'gold' : r === 4 ? 'lilac' : ''));
  });
}

/* ---------------- detail sheet ---------------- */
let pendingTarget = null;

async function openSheet(id){
  S.open = id;
  const sp = BY_ID.get(id);
  const e = entry(id);
  const sheet = $('#sheet');
  sheet.hidden = false;
  document.body.style.overflow = 'hidden';

  const collTags = sp.colls.map(c => {
    const col = COLLECTIONS.find(x => x.key === c);
    return col ? `<span class="tag coll">${col.name}</span>` : '';
  }).join('');

  sheet.innerHTML = `
    <div class="sheet-inner">
      <div class="sheet-bar">
        <button class="backbtn" id="sheetBack">${icon('back')} Dex</button>
        <span class="sheet-no">No.${sp.no}</span>
      </div>
      <div class="entry">
        <div class="bigshot" id="bigshot"><span class="glyph">${GROUP_OF[sp.group].glyph}</span></div>
        <h2 id="sheetName">${sp.name}</h2>
        <div class="sci">${sp.sci}</div>
        <div class="chips">
          <span class="tag r${sp.rarity}">${RARITY[sp.rarity]}</span>
          <span class="tag coll">${GROUP_OF[sp.group].name}</span>
          ${collTags}
        </div>
        <p class="blurb">${RARITY_NOTE[sp.rarity]}</p>
        <div class="btnrow">
          <button class="btn primary" id="btnCam">${icon('cam')} Take photo</button>
          <button class="btn" id="btnPick">${icon('img')} From gallery</button>
        </div>
        <div class="btnrow"><button class="btn" id="btnSeen"></button></div>
        <div class="gallery" id="gallery"></div>
        <div class="fields">
          <div class="field"><label for="fDate">Date seen</label><input id="fDate" type="date" value="${e.date || ''}"></div>
          <div class="field"><label for="fPlace">Where</label><input id="fPlace" type="text" placeholder="S100, Lower Sabie, Sunset Dam…" value="${(e.place||'').replace(/"/g,'&quot;')}"></div>
          <div class="field"><label for="fNotes">Field notes</label><textarea id="fNotes" placeholder="Behaviour, herd size, light, who spotted it first…">${e.notes || ''}</textarea></div>
        </div>
      </div>
    </div>`;

  sheet.scrollTop = 0;
  $('#sheetBack').addEventListener('click', closeSheet);
  $('#btnCam').addEventListener('click', () => { pendingTarget = id; $('#fileCam').click(); });
  $('#btnPick').addEventListener('click', () => { pendingTarget = id; $('#filePick').click(); });
  $('#btnSeen').addEventListener('click', async () => {
    const en = entry(id);
    en.seen = !en.seen;
    if(en.seen){ en.ts = Date.now(); if(!en.date) en.date = todayStr(); }
    await saveEntry(en);
    paintSeenBtn(id);
    refreshAll();
    toast(en.seen ? 'Logged — ' + sp.name : 'Removed from your list');
  });

  const persist = debounce(async () => {
    const en = entry(id);
    en.date = $('#fDate').value;
    en.place = $('#fPlace').value.trim();
    en.notes = $('#fNotes').value.trim();
    await saveEntry(en);
    refreshAll();
  }, 400);
  ['#fDate','#fPlace','#fNotes'].forEach(sel => $(sel).addEventListener('input', persist));

  paintSeenBtn(id);
  await paintGallery(id);
}
function paintSeenBtn(id){
  const b = $('#btnSeen');
  if(!b) return;
  const seen = isSeen(id);
  b.className = 'btn' + (seen ? '' : ' primary');
  b.innerHTML = seen ? icon('check') + ' Logged — tap to undo' : icon('check') + ' Mark as seen';
}
async function paintGallery(id){
  const box = $('#gallery');
  if(!box) return;
  const e = entry(id);
  const big = $('#bigshot');
  if(big){
    if(e.photos.length){
      const u = await urlsFor(e.photos[0]);
      if(u) big.innerHTML = `<img alt="Your photo of ${BY_ID.get(id).name}" src="${u.full}">`;
    } else {
      big.innerHTML = `<span class="glyph">${GROUP_OF[BY_ID.get(id).group].glyph}</span>`;
    }
  }
  box.textContent = '';
  for(const pid of e.photos){
    const u = await urlsFor(pid);
    if(!u) continue;
    const fig = el('div','shot');
    fig.innerHTML = `<img alt="Your photo of ${BY_ID.get(id).name}" src="${u.full}"><button class="del" aria-label="Delete photo">${icon('x')}</button>`;
    fig.querySelector('.del').addEventListener('click', async ev => {
      ev.stopPropagation();
      const en = entry(id);
      en.photos = en.photos.filter(p => p !== pid);
      await dropPhoto(pid);
      await saveEntry(en);
      await paintGallery(id);
      refreshAll();
      toast('Photo deleted');
    });
    box.appendChild(fig);
  }
  const dz = el('div','dropzone', e.photos.length ? 'Add another' : 'No photo yet');
  box.appendChild(dz);
}
function closeSheet(){
  $('#sheet').hidden = true;
  $('#sheet').textContent = '';
  document.body.style.overflow = '';
  S.open = null;
}

/* ---------------- shared refresh ---------------- */
function refreshAll(){
  renderTally();
  if(S.view === 'list') renderList();
  if(S.view === 'coll') renderCollections();
  if(S.view === 'prog') renderProgress();
}
function debounce(fn, ms){ let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
/* ---------------- bridge for the wiring script ---------------- */
Object.assign(window, {
  __S: S,
  __refresh: refreshAll,
  __renderList: renderList,
  __toast: (m) => toast(m),
  __pending: () => pendingTarget,
  __addPhotos: addPhotos,
  __paintGallery: paintGallery,
  __paintSeenBtn: paintSeenBtn,
  __closeSheet: closeSheet,
  __syncFields: id => {
    const e = LOG.get(id); if(!e || S.open !== id) return;
    const d = document.querySelector('#fDate');
    if(d && !d.value && e.date) d.value = e.date;
  },
  __logRows: () => JSON.parse(JSON.stringify([...LOG.values()].filter(hasContent))),
  __getPhoto: getPhoto,
  __storageReport: storageReport,
  __requestDurable: requestDurableStorage,
  __putPhoto: rec => pReq(tx('photos','readwrite').put(rec)),
  __putLog: e => pReq(tx('log','readwrite').put(e)),
  __reload: async () => { PHOTO_URLS.forEach(u => { URL.revokeObjectURL(u.full); URL.revokeObjectURL(u.thumb); }); PHOTO_URLS.clear(); LOG.clear(); await loadAll(); }
});

/* Without this the browser files the list as "best-effort" and may evict it when
   the phone runs low on space. Chrome grants it silently once the app looks used
   — added to the home screen, opened a few times — so ask on every start. */
async function requestDurableStorage(){
  try{
    if(!navigator.storage || !navigator.storage.persist) return null;
    if(await navigator.storage.persisted()) return true;
    return await navigator.storage.persist();
  }catch(_){ return null; }
}
async function storageReport(){
  const out = {durable:null, usage:0, quota:0, memory:useMem};
  try{
    if(navigator.storage && navigator.storage.persisted) out.durable = await navigator.storage.persisted();
    if(navigator.storage && navigator.storage.estimate){
      const est = await navigator.storage.estimate();
      out.usage = est.usage || 0;
      out.quota = est.quota || 0;
    }
  }catch(_){}
  return out;
}

/* ---------------- boot ---------------- */
(async function boot(){
  try{
    idb = await openDB();
    await loadAll();
  }catch(err){
    useMem = true;
    setTimeout(() => toast('Storage is blocked in this browser — ticks will not survive a reload.'), 900);
  }
  renderChips();
  refreshAll();
  if(!useMem) requestDurableStorage();
})();
let toastTimer;
function toast(msg){
  document.querySelectorAll('.toast').forEach(n => n.remove());
  const t = el('div','toast', msg);
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 2600);
}
})();
</script>
