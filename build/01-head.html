<title>Kruger Life List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@1,400&display=swap">
<style>
/* ---- tokens: light is the base, both dark paths redefine only these ---- */
:root{
  --ground:#E9EBE6; --surface:#F6F7F3; --surface-2:#DCE0D7; --sunk:#D2D7CB;
  --line:#C4CABC; --line-soft:#D8DCD2;
  --ink:#151912; --ink-2:#4C5348; --ink-3:#79806F;
  --accent:#0C7A71; --accent-ink:#FFFFFF; --accent-soft:#C6E2DE; --accent-line:#7FBDB6;
  --gold:#8A6410; --gold-soft:#EDDCB4;
  --lilac:#5C4C90; --lilac-soft:#DAD4EE;
  --shadow:0 1px 2px rgba(20,26,18,.10), 0 8px 24px rgba(20,26,18,.08);
  --shadow-lift:0 2px 6px rgba(20,26,18,.14), 0 18px 44px rgba(20,26,18,.18);
  --r:3px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E110D; --surface:#171B15; --surface-2:#20251D; --sunk:#0A0C09;
    --line:#333A2E; --line-soft:#262C21;
    --ink:#E9ECE3; --ink-2:#A7AF9E; --ink-3:#6F7768;
    --accent:#3ECFC0; --accent-ink:#062421; --accent-soft:#123B37; --accent-line:#1F6B64;
    --gold:#D9AC48; --gold-soft:#3A2E12;
    --lilac:#AC9AE2; --lilac-soft:#2A2340;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.42);
    --shadow-lift:0 2px 6px rgba(0,0,0,.55), 0 18px 44px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --ground:#0E110D; --surface:#171B15; --surface-2:#20251D; --sunk:#0A0C09;
  --line:#333A2E; --line-soft:#262C21;
  --ink:#E9ECE3; --ink-2:#A7AF9E; --ink-3:#6F7768;
  --accent:#3ECFC0; --accent-ink:#062421; --accent-soft:#123B37; --accent-line:#1F6B64;
  --gold:#D9AC48; --gold-soft:#3A2E12;
  --lilac:#AC9AE2; --lilac-soft:#2A2340;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.42);
  --shadow-lift:0 2px 6px rgba(0,0,0,.55), 0 18px 44px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.45;
  -webkit-text-size-adjust:100%;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.app{max-width:760px;margin:0 auto;padding-bottom:96px}

/* ---- masthead: the instrument panel ---- */
.masthead{
  position:sticky;top:0;z-index:30;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  padding:10px 14px 0;
}
.mast-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.wordmark{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;display:flex;align-items:baseline;gap:7px;min-width:0}
.wm-1{font-weight:800;font-size:15px;letter-spacing:-.015em;text-transform:uppercase}
.wm-2{font-weight:500;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.mast-tools{display:flex;gap:4px;flex:0 0 auto}
.icon-btn{
  background:none;border:1px solid transparent;color:var(--ink-2);
  width:32px;height:32px;border-radius:var(--r);cursor:pointer;
  display:grid;place-items:center;padding:0;
}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:17px;height:17px;display:block}

.tally{display:flex;align-items:baseline;gap:6px;padding:6px 0 8px;flex-wrap:wrap}
.tally-num{
  font-family:Archivo,sans-serif;font-weight:800;font-size:40px;line-height:.9;
  letter-spacing:-.035em;font-variant-numeric:tabular-nums;color:var(--ink);
}
.tally-slash{font-family:Archivo,sans-serif;font-weight:500;font-size:24px;color:var(--ink-3);line-height:1}
.tally-tot{font-family:Archivo,sans-serif;font-weight:600;font-size:24px;color:var(--ink-3);font-variant-numeric:tabular-nums;line-height:1}
.tally-label{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);margin-left:2px}
.tally-pct{
  margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;
  color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);
  padding:2px 7px;border-radius:2px;font-variant-numeric:tabular-nums;
}

/* segmented rail: one segment per taxon group, width = share of the checklist */
.rail{display:flex;gap:2px;height:7px;padding-bottom:10px;align-items:stretch}
.rail-seg{position:relative;background:var(--sunk);border-radius:1px;overflow:hidden;min-width:3px}
.rail-fill{position:absolute;inset:0 auto 0 0;background:var(--accent);transition:width .35s cubic-bezier(.2,.7,.3,1)}

/* ---- view tabs ---- */
.viewtabs{
  position:sticky;top:0;z-index:29;display:flex;gap:0;
  background:var(--surface);border-bottom:1px solid var(--line);
}
.viewtab{
  flex:1;background:none;border:0;border-bottom:2px solid transparent;
  padding:11px 6px 9px;cursor:pointer;color:var(--ink-3);
  font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;
}
.viewtab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* ---- controls ---- */
.controls{padding:12px 14px 4px;display:flex;flex-direction:column;gap:9px}
.search-wrap{position:relative;display:flex;align-items:center}
.search-wrap svg{position:absolute;left:10px;width:15px;height:15px;color:var(--ink-3);pointer-events:none}
#search{
  width:100%;padding:10px 34px 10px 32px;border:1px solid var(--line);
  background:var(--surface);border-radius:var(--r);color:var(--ink);
}
#search::placeholder{color:var(--ink-3)}
.clear-search{position:absolute;right:4px;background:none;border:0;color:var(--ink-3);cursor:pointer;padding:6px;line-height:0}
.clear-search svg{position:static;width:14px;height:14px}

.chiprow{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);
  padding:5px 10px;border-radius:2px;cursor:pointer;white-space:nowrap;
  font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;
  display:flex;align-items:center;gap:6px;
}
.chip b{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.chip[aria-pressed="true"] b{color:var(--ground);opacity:.65}

.filterbar{display:flex;gap:8px;align-items:center;justify-content:space-between}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{
  background:none;border:0;padding:6px 11px;cursor:pointer;color:var(--ink-3);
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;
}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
#sort{
  border:1px solid var(--line);background:var(--surface);border-radius:var(--r);
  padding:6px 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--ink-2);
}
.count-note{
  padding:8px 14px 2px;font-family:"IBM Plex Mono",monospace;font-size:11px;
  color:var(--ink-3);letter-spacing:.02em;font-variant-numeric:tabular-nums;
}

/* ---- species list ---- */
.grouphead{
  display:flex;align-items:center;gap:10px;padding:18px 14px 7px;
}
.grouphead h2{
  margin:0;font-family:Archivo,sans-serif;font-weight:700;font-size:12px;
  letter-spacing:.15em;text-transform:uppercase;color:var(--ink);
}
.grouphead .gcount{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.grouphead hr{flex:1;border:0;border-top:1px solid var(--line);margin:0}

.list{list-style:none;margin:0;padding:0 14px;display:flex;flex-direction:column;gap:1px}
.row{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:8px 10px 8px 8px;cursor:pointer;
}
.row:hover{border-color:var(--line)}
.row.is-seen{background:var(--surface-2);border-color:var(--accent-line)}
.thumb{
  flex:0 0 auto;width:48px;height:48px;border-radius:2px;background:var(--sunk);
  display:grid;place-items:center;overflow:hidden;position:relative;
  border:1px dashed var(--line);
}
.row.is-seen .thumb{border-style:solid;border-color:var(--accent-line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .glyph{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-3);letter-spacing:.05em}
.thumb .multi{
  position:absolute;right:2px;bottom:2px;background:rgba(0,0,0,.66);color:#fff;
  font-family:"IBM Plex Mono",monospace;font-size:9px;padding:0 3px;border-radius:2px;
}
.rowbody{min-width:0;flex:1}
.rname{font-weight:600;font-size:14.5px;letter-spacing:-.005em;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.is-seen .rname{color:var(--ink)}
.rsci{
  font-family:"IBM Plex Serif",Georgia,serif;font-style:italic;font-size:12.5px;color:var(--ink-3);
  display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.rmeta{display:flex;align-items:center;gap:5px;margin-top:3px;flex-wrap:wrap}
.tag{
  font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
  padding:1px 5px;border-radius:2px;border:1px solid;
}
.r1{color:var(--ink-3);border-color:var(--line)}
.r2{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.r3{color:var(--gold);border-color:var(--gold);background:var(--gold-soft)}
.r4{color:var(--lilac);border-color:var(--lilac);background:var(--lilac-soft)}
.coll{color:var(--ink-2);border-color:var(--line);background:var(--surface-2)}
.tick{
  flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);
  background:none;cursor:pointer;display:grid;place-items:center;color:transparent;padding:0;
}
.tick svg{width:14px;height:14px}
.row.is-seen .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.empty{padding:48px 20px;text-align:center;color:var(--ink-3)}
.empty strong{display:block;font-family:Archivo,sans-serif;font-size:15px;color:var(--ink-2);margin-bottom:5px}
</style>
