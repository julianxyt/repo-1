<title>Kruger Life List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;600;700;900&family=Silkscreen:wght@400;700&display=swap">
<style>
/* ---- tokens: a handheld field index. Red shell, inset screen. ---- */
:root{
  --shell:#A82A21; --shell-hi:#C9463A; --shell-lo:#78140F; --shell-ink:#FFEDE9;
  --screen:#E3E7D3; --screen-2:#D2D8BE; --screen-3:#C3CBAC; --screen-sunk:#B9C2A0;
  --ink:#141B0E; --ink-2:#48513C; --ink-3:#78826A; --line:#AEB995;
  --lamp:#4FA9E8; --lamp-hi:#C6E6FA;
  --caught:#1C6E38; --caught-soft:#BFDCC7;
  --gold:#8E6108; --gold-soft:#E6D6A6;
  --vrare:#5B4189; --vrare-soft:#D8CFEA;
  --r:4px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --shell:#7E1F18; --shell-hi:#A6362B; --shell-lo:#4A0F0B; --shell-ink:#F7DBD6;
    --screen:#161D15; --screen-2:#1F281D; --screen-3:#2A3427; --screen-sunk:#0D120C;
    --ink:#DEE8D3; --ink-2:#94A189; --ink-3:#6C7962; --line:#374231;
    --lamp:#6FC0F5; --lamp-hi:#D2ECFC;
    --caught:#4FCB78; --caught-soft:#12331E;
    --gold:#D9A93F; --gold-soft:#332711;
    --vrare:#A995E0; --vrare-soft:#241C38;
  }
}
:root[data-theme="dark"]{
  --shell:#7E1F18; --shell-hi:#A6362B; --shell-lo:#4A0F0B; --shell-ink:#F7DBD6;
  --screen:#161D15; --screen-2:#1F281D; --screen-3:#2A3427; --screen-sunk:#0D120C;
  --ink:#DEE8D3; --ink-2:#94A189; --ink-3:#6C7962; --line:#374231;
  --lamp:#6FC0F5; --lamp-hi:#D2ECFC;
  --caught:#4FCB78; --caught-soft:#12331E;
  --gold:#D9A93F; --gold-soft:#332711;
  --vrare:#A995E0; --vrare-soft:#241C38;
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--shell);color:var(--ink);
  font-family:Chivo,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.45;
  -webkit-text-size-adjust:100%;overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
.px{font-family:Silkscreen,ui-monospace,monospace;letter-spacing:.02em}

.app{max-width:760px;margin:0 auto;padding-bottom:90px}

/* ---- the device top ---- */
.deck{
  background:var(--shell);
  border-bottom:3px solid var(--shell-lo);
  padding:12px 14px 0;
}
.deck-top{display:flex;align-items:center;gap:12px}
.lamp-big{
  width:36px;height:36px;border-radius:50%;flex:0 0 auto;
  background:radial-gradient(circle at 32% 28%, var(--lamp-hi) 0 18%, var(--lamp) 45%, #1C5B86 100%);
  border:3px solid var(--shell-ink);box-shadow:0 0 0 2px var(--shell-lo), 0 0 12px rgba(79,169,232,.5);
  animation:blink 3.4s ease-in-out infinite;
}
@keyframes blink{0%,92%,100%{opacity:1}96%{opacity:.55}}
.lamps{display:flex;gap:5px;flex:0 0 auto}
.lamps i{width:9px;height:9px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.35)}
.lamps i:nth-child(1){background:#E8543F}
.lamps i:nth-child(2){background:#E8C33A}
.lamps i:nth-child(3){background:#57C46B}
.title{flex:1;min-width:0}
.title b{
  display:block;font-weight:900;font-size:15px;letter-spacing:-.01em;color:var(--shell-ink);
  text-transform:uppercase;line-height:1.1;
}
.title span{display:block;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,237,233,.62);margin-top:2px}
.deck-tools{display:flex;gap:3px;flex:0 0 auto}
.icon-btn{
  background:rgba(0,0,0,.18);border:1px solid var(--shell-lo);color:var(--shell-ink);
  width:31px;height:31px;border-radius:var(--r);cursor:pointer;display:grid;place-items:center;padding:0;
}
.icon-btn:hover{background:var(--shell-hi)}
.icon-btn svg{width:16px;height:16px;display:block}

/* the counter readout, inset into the shell like an LCD */
.readout{
  margin:11px 0 0;background:var(--screen-sunk);border:2px solid var(--shell-lo);
  border-radius:var(--r) var(--r) 0 0;padding:9px 12px 10px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.readout .big{font-family:Silkscreen,monospace;font-weight:700;font-size:26px;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.readout .of{font-family:Silkscreen,monospace;font-size:14px;color:var(--ink-3);line-height:1}
.readout .lbl{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
.readout .pct{
  margin-left:auto;font-family:Silkscreen,monospace;font-size:12px;color:var(--caught);
  background:var(--caught-soft);border:1px solid var(--caught);padding:2px 7px;border-radius:2px;
}
.rail{
  display:flex;gap:2px;background:var(--screen-sunk);padding:0 12px 9px;
  border:2px solid var(--shell-lo);border-top:0;border-radius:0 0 var(--r) var(--r);
  margin-bottom:11px;
}
.rail-seg{position:relative;background:var(--screen-3);border-radius:1px;overflow:hidden;min-width:3px;height:6px}
.rail-fill{position:absolute;inset:0 auto 0 0;background:var(--caught);transition:width .35s ease}

/* ---- device buttons as tabs ---- */
.viewtabs{display:flex;gap:5px;background:var(--shell);padding:9px 14px 11px;position:sticky;top:0;z-index:29;border-bottom:3px solid var(--shell-lo)}
.viewtab{
  flex:1;background:var(--screen-2);border:2px solid var(--shell-lo);border-bottom-width:3px;
  border-radius:var(--r);padding:8px 4px;cursor:pointer;color:var(--ink-2);
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
}
.viewtab[aria-selected="true"]{background:var(--screen);color:var(--ink);border-bottom-width:2px;margin-top:1px;box-shadow:inset 0 2px 0 rgba(0,0,0,.09)}

/* ---- the screen: everything below the deck ---- */
.screen{background:var(--screen);border-top:2px solid var(--shell-lo);min-height:60vh;padding-bottom:22px}
.controls{padding:13px 14px 4px;display:flex;flex-direction:column;gap:8px}
.search-wrap{position:relative;display:flex;align-items:center}
.search-wrap > svg{position:absolute;left:9px;width:15px;height:15px;color:var(--ink-3);pointer-events:none}
#search{width:100%;padding:10px 32px 10px 30px;border:2px solid var(--line);background:var(--screen-2);border-radius:var(--r);color:var(--ink)}
#search::placeholder{color:var(--ink-3)}
.clear-search{position:absolute;right:3px;background:none;border:0;color:var(--ink-3);cursor:pointer;padding:6px;line-height:0}
.clear-search svg{width:14px;height:14px}
.chiprow{display:flex;gap:5px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;background:var(--screen-2);border:2px solid var(--line);color:var(--ink-2);
  padding:5px 9px;border-radius:var(--r);cursor:pointer;white-space:nowrap;
  font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
  display:flex;align-items:center;gap:6px;
}
.chip b{font-family:Silkscreen,monospace;font-weight:400;font-size:9.5px;color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--screen)}
.chip[aria-pressed="true"] b{color:var(--screen);opacity:.7}
.filterbar{display:flex;gap:7px;align-items:center;justify-content:space-between}
.seg{display:flex;border:2px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--screen-2)}
.seg button{background:none;border:0;padding:6px 10px;cursor:pointer;color:var(--ink-3);font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:700}
.seg button + button{border-left:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--screen)}
#sort{border:2px solid var(--line);background:var(--screen-2);border-radius:var(--r);padding:6px 7px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--ink-2)}
.count-note{padding:9px 14px 0;font-family:Silkscreen,monospace;font-size:10px;color:var(--ink-3)}
</style>
